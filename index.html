<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" />
<title>MiniBrowser</title>
<style>
  /* ---------- Palette ----------
     Light, and strictly monochrome. Chrome's identity is its blue-grey
     neutrals and the #8ab4f8 accent; there is no hue anywhere here, so
     nothing can read as Chrome.

     The value order is: tab strip recessed grey, toolbar a shade lighter,
     active tab pure white so it lifts off the strip.

     Two values are mirrored in main.js and must be changed together:
     --chrome-bg matches titleBarOverlay.color, --text matches symbolColor. */
  :root {
    --chrome-bg:      #e6e6e6;
    --toolbar-bg:     #f7f7f7;
    --tab-active:     #ffffff;
    --tab-hover:      #efefef;
    --omnibox-bg:     #ebebeb;
    --omnibox-focus:  #e2e2e2;
    --text:           #111111;
    --text-dim:       #5f5f5f;
    --text-faint:     #a6a6a6;  /* disabled controls only */
    --accent:         #111111;
    --border:         #d4d4d4;
  }

  * { box-sizing: border-box; }

  /* The gutter around the floating page area shows through from here, so it
     matches the toolbar directly above it — using --chrome-bg would leave a
     visible seam where the toolbar ends. */
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--toolbar-bg);
    color: var(--text);
    font: 13px/1.4 system-ui, "Segoe UI", Roboto, sans-serif;
    user-select: none;
  }

  /* position: relative so the engine menu can anchor to the window. */
  #app { display: flex; flex-direction: column; height: 100%; position: relative; }

  /* ---------- Tab strip ---------- */
  /* With the OS title bar gone, this strip is the window's drag handle.
     The big right padding clears the native minimize/maximize/close buttons,
     which Electron paints over this area (titleBarOverlay in main.js). */
  #tabstrip {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 40px;
    padding: 6px 8px 0;
    background: var(--chrome-bg);
    flex: 0 0 auto;
    -webkit-app-region: drag;
  }

  /* Only on Windows do native caption buttons sit over this strip, so only
     there do we reserve room for them. Elsewhere the window keeps its normal
     title bar and the tabs can use the full width. */
  body.has-overlay #tabstrip { padding-right: 148px; }

  /* Anything clickable must opt out of the drag region, or it can't be
     clicked — the OS swallows the press as a window move. */
  .tab,
  #newtab { -webkit-app-region: no-drag; }

  /* Fullscreen hides the native caption buttons, so reclaim their space. */
  body.fullscreen #tabstrip { padding-right: 8px; }

  #tabs {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
  }

  /* Detached rounded pills, not Chrome's fused-to-the-toolbar trapezoids.
     The active tab is marked by a lighter fill rather than by merging into
     the row below it. */
  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    margin-bottom: 4px;
    padding: 0 8px 0 12px;
    min-width: 60px;
    max-width: 220px;
    flex: 1 1 200px;
    border-radius: 15px;
    background: transparent;
    cursor: default;
    overflow: hidden;
  }
  .tab:hover { background: var(--tab-hover); }
  .tab.active { background: var(--tab-active); }
  .tab.active:hover { background: var(--tab-active); }

  .favicon {
    width: 16px; height: 16px;
    flex: 0 0 16px;
    border-radius: 3px;
    object-fit: contain;
  }
  .favicon.blank { background: var(--border); }

  .spinner {
    width: 14px; height: 14px;
    flex: 0 0 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tab.loading .spinner { display: block; }
  .tab.loading .favicon { display: none; }

  .tab-title {
    flex: 1 1 auto;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .tab:not(.active) .tab-title { color: var(--text-dim); }

  .tab-close {
    flex: 0 0 18px;
    width: 18px; height: 18px;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: transparent;
    color: var(--text-dim);
    font-size: 15px; line-height: 1;
    cursor: default;
    opacity: 0;
  }
  .tab:hover .tab-close, .tab.active .tab-close { opacity: 1; }
  .tab-close:hover { background: var(--border); color: var(--text); }

  #newtab {
    flex: 0 0 30px;
    width: 30px; height: 30px;
    margin-bottom: 4px;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: transparent;
    color: var(--text-dim);
    font-size: 18px; line-height: 1;
    cursor: default;
  }
  #newtab:hover { background: var(--tab-hover); color: var(--text); }

  /* ---------- Toolbar ---------- */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 44px;
    padding: 0 8px;
    background: var(--toolbar-bg);
    flex: 0 0 auto;
  }

  .navbtn {
    flex: 0 0 30px;
    width: 30px; height: 30px;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: transparent;
    color: var(--text);
    cursor: default;
    padding: 0;
  }
  .navbtn:hover:not(:disabled) { background: rgba(0,0,0,.08); }
  .navbtn:disabled { color: var(--text-faint); }
  .navbtn svg { width: 16px; height: 16px; fill: currentColor; }

  #omnibox {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    margin: 0 6px;
    padding: 0 14px;
    border-radius: 15px;
    background: var(--omnibox-bg);
  }
  #omnibox:focus-within { background: var(--omnibox-focus); box-shadow: 0 0 0 2px var(--accent); }

  /* Security state is signalled by SHAPE, not colour — a padlock or a warning
     triangle. A monochrome palette can't lean on red, and shape is legible to
     colourblind users anyway. */
  #lock { flex: 0 0 14px; width: 14px; height: 14px; fill: var(--text-dim); }
  #lock .warn { display: none; }
  #lock.insecure { fill: var(--text); }
  #lock.insecure .shut { display: none; }
  #lock.insecure .warn { display: block; }

  #url {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    user-select: text;
  }
  #url::placeholder { color: var(--text-dim); }

  /* ---------- Search engine picker ---------- */
  #engine {
    display: flex;
    align-items: center;
    gap: 5px;
    height: 24px;
    padding: 0 9px;
    margin-right: 2px;
    border: 0;
    border-radius: 12px;
    background: rgba(0,0,0,.06);
    color: var(--text);
    font: inherit;
    font-size: 11px;
    white-space: nowrap;
    cursor: default;
  }
  #engine:hover { background: rgba(0,0,0,.11); }
  #engine svg { width: 12px; height: 12px; fill: currentColor; flex: 0 0 12px; }

  /* Anchored under the toolbar: 40px tab strip + 44px toolbar. */
  #enginemenu {
    position: absolute;
    top: 84px;
    right: 8px;
    z-index: 10;
    min-width: 232px;
    padding: 5px;
    border-radius: 10px;
    background: var(--tab-active);
    box-shadow: 0 0 0 1px var(--border), 0 10px 28px rgba(0,0,0,.16);
    display: none;
  }
  #enginemenu.open { display: block; }

  .engine-opt {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 7px 9px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: default;
  }
  .engine-opt:hover { background: var(--tab-hover); }
  .engine-opt .tick {
    flex: 0 0 13px;
    width: 13px; height: 13px;
    fill: var(--text);
    visibility: hidden;
  }
  .engine-opt.active .tick { visibility: visible; }
  .engine-opt .label { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .engine-opt .label b { font-weight: 600; font-size: 12px; }
  .engine-opt .label small { color: var(--text-dim); font-size: 10.5px; }

  /* SearXNG instance editor, shown under that row when it's the live engine.
     Public instances die; this makes swapping one a five-second job instead
     of a source edit. */
  .instance {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 2px 5px 6px 31px;   /* 31px lines up with the option label */
  }
  .instance input {
    width: 100%;
    height: 26px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--toolbar-bg);
    color: var(--text);
    font: inherit;
    font-size: 11px;
    outline: 0;
    user-select: text;
  }
  .instance input:focus { border-color: var(--text); }
  .instance small { color: var(--text-dim); font-size: 10px; line-height: 1.35; }

  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    padding: 2px 7px;
    border: 0;
    border-radius: 9px;
    background: rgba(0,0,0,.06);
    color: var(--text-dim);
    font: inherit;
    font-size: 10px;
    cursor: default;
  }
  .chip:hover { background: rgba(0,0,0,.12); color: var(--text); }
  .chip.active { background: var(--text); color: var(--tab-active); }

  /* Blocked-request counter. Hidden until something is actually blocked, so
     it reads as a result rather than as chrome. */
  #shield {
    display: none;
    align-items: center;
    gap: 5px;
    height: 24px;
    padding: 0 9px 0 7px;
    margin-right: 2px;
    border-radius: 12px;
    background: rgba(0,0,0,.06);
    color: var(--text);
    cursor: default;
  }
  #shield.on { display: flex; }
  #shield svg { width: 13px; height: 13px; fill: currentColor; flex: 0 0 13px; }
  #shield span { font-size: 11px; font-variant-numeric: tabular-nums; }

  /* ---------- Page area ---------- */
  /* The page floats inside the window instead of filling it edge to edge —
     an 8px gutter of pure black on three sides, with rounded corners. */
  #views {
    flex: 1 1 auto;
    position: relative;
    margin: 0 8px 8px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--border);
    background: #fff;
    min-height: 0;
  }
  /* Each tab's page sits in a wrapper, and the WRAPPER is what we show/hide.
     Electron requires <webview> to keep display:flex — overriding it (e.g.
     with display:none) breaks how the guest page is measured and sized. */
  .view-wrap {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    overflow: hidden;
    display: none;
  }
  .view-wrap.active { display: block; }

  webview {
    display: flex;   /* required by Electron — do not override */
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>
  <div id="app">

    <div id="tabstrip">
      <div id="tabs"></div>
      <button id="newtab" title="New tab (Ctrl+T)">+</button>
    </div>

    <div id="toolbar">
      <button class="navbtn" id="back" title="Back (Alt+Left)" disabled>
        <svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
      </button>
      <button class="navbtn" id="forward" title="Forward (Alt+Right)" disabled>
        <svg viewBox="0 0 24 24"><path d="M4 13h12.2l-5.6 5.6L12 20l8-8-8-8-1.4 1.4 5.6 5.6H4z"/></svg>
      </button>
      <button class="navbtn" id="reload" title="Reload (Ctrl+R)">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6a5.9 5.9 0 0 1 4.22 1.78L13 11h7V4z"/></svg>
      </button>
      <button class="navbtn" id="home" title="Home">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </button>

      <div id="omnibox">
        <svg id="lock" viewBox="0 0 24 24">
          <path class="shut" d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9zm3 13a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>
          <path class="warn" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
        </svg>
        <input id="url" type="text" spellcheck="false" autocomplete="off"
               placeholder="Search or type a URL" />
      </div>

      <button id="engine" title="Change search engine">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span id="enginename">—</span>
      </button>

      <div id="shield" title="Ads and trackers blocked on this page">
        <svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
        <span id="blockcount">0</span>
      </div>
    </div>

    <!-- Populated by renderer.js from SEARCH_ENGINES. -->
    <div id="enginemenu"></div>

    <div id="views"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
