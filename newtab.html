<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" />
<title>New tab</title>
<style>
  /* Light monochrome, matching index.html. No hue anywhere.
     --bg is pure white so this page sits flush inside the rounded page area
     rather than showing as a panel within it. */
  :root {
    --bg:      #ffffff;
    --card:    #f2f2f2;
    --card-hi: #e8e8e8;
    --text:    #111111;
    --dim:     #5f5f5f;
    --faint:   #757575;  /* 4.6:1 on white — the footer hint stays readable */
    --accent:  #111111;
    --border:  #dcdcdc;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, "Segoe UI", Roboto, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 40px 24px;
  }

  /* ---- clock ---- */
  #clock {
    font-size: 76px;
    font-weight: 200;
    letter-spacing: -2px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #date {
    margin-top: 8px;
    color: var(--dim);
    font-size: 15px;
  }
  #greeting {
    margin-top: 2px;
    color: var(--dim);
    font-size: 15px;
  }
  .head { text-align: center; }

  /* ---- search ---- */
  form {
    width: 100%;
    max-width: 560px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    height: 48px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    transition: background .15s, border-color .15s;
  }
  form:focus-within {
    background: var(--card-hi);
    border-color: var(--accent);
  }
  form svg { flex: 0 0 18px; width: 18px; height: 18px; fill: var(--dim); }
  form input {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 15px;
  }
  form input::placeholder { color: var(--dim); }

  /* ---- quick links ---- */
  #links {
    display: grid;
    grid-template-columns: repeat(auto-fit, 92px);
    justify-content: center;
    gap: 10px;
    width: 100%;
    max-width: 560px;
  }
  #links a {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    padding: 16px 6px;
    border-radius: 10px;
    text-decoration: none;
    color: var(--dim);
    font-size: 12px;
    transition: background .15s;
  }
  #links a:hover { background: var(--card); color: var(--text); }
  .tile {
    width: 42px; height: 42px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--card-hi);
    color: var(--text);
    font-size: 17px;
    font-weight: 600;
  }
  #links a span:last-child {
    max-width: 80px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  footer {
    position: fixed;
    bottom: 18px;
    color: var(--faint);
    font-size: 12px;
  }
  kbd {
    background: var(--card-hi);
    border-radius: 4px;
    padding: 1px 5px;
    font: inherit;
    font-size: 11px;
    color: var(--dim);
  }
</style>
</head>
<body>

  <div class="head">
    <div id="clock">--:--</div>
    <div id="date"></div>
    <div id="greeting"></div>
  </div>

  <!-- Submits straight to the chosen engine. No IPC needed: the form navigates
       this webview, and the browser's address bar follows along automatically.
       The action and field name below are rewritten by the script at the
       bottom; these values are the SearXNG defaults, used if that never runs. -->
  <form action="https://searx.be/search" method="get" autocomplete="off">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input name="q" type="text" placeholder="Search" autofocus spellcheck="false" />
  </form>

  <div id="links"></div>

  <footer><kbd>Ctrl</kbd> + <kbd>L</kbd> to jump to the address bar</footer>

<script>
  // ---- search engine ----
  // This page has no preload bridge, so renderer.js passes the chosen engine
  // in the query string (`newtab.html?engine=…`). Engines disagree on the
  // field name — Marginalia wants `query`, the others want `q` — so the form
  // has to be rewritten, not just re-pointed.
  // Keep this table in sync with SEARCH_ENGINES in renderer.js.
  const params = new URLSearchParams(location.search);

  // SearXNG has no fixed home — the instance is chosen in the toolbar and
  // arrives here as a parameter.
  const instance = params.get('instance') || 'https://searx.be';

  const ENGINES = {
    searxng:    { name: 'SearXNG',    action: instance + '/search',                   param: 'q' },
    marginalia: { name: 'Marginalia', action: 'https://marginalia-search.com/search', param: 'query' },
    duckduckgo: { name: 'DuckDuckGo', action: 'https://duckduckgo.com/',              param: 'q' },
  };

  const engine = ENGINES[params.get('engine')] || ENGINES.searxng;
  const form = document.querySelector('form');
  const searchInput = form.querySelector('input');

  form.action = engine.action;
  searchInput.name = engine.param;
  searchInput.placeholder = 'Search ' + engine.name;

  // ---- clock + greeting ----
  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    document.getElementById('date').textContent =
      now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });

    const h = now.getHours();
    const part = h < 5 ? 'night' : h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening';
    document.getElementById('greeting').textContent = 'Good ' + part + ', Smruti';
  }
  tick();
  setInterval(tick, 10000);

  // ---- quick links ----
  // Edit this array to change your tiles.
  const LINKS = [
    { name: 'YouTube',   url: 'https://youtube.com' },
    { name: 'GitHub',    url: 'https://github.com' },
    { name: 'Gmail',     url: 'https://mail.google.com' },
    { name: 'Wikipedia', url: 'https://wikipedia.org' },
    { name: 'Reddit',    url: 'https://reddit.com' },
    { name: 'Maps',      url: 'https://maps.google.com' },
  ];

  const wrap = document.getElementById('links');
  for (const link of LINKS) {
    const a = document.createElement('a');
    a.href = link.url;

    const tile = document.createElement('span');
    tile.className = 'tile';
    tile.textContent = link.name[0].toUpperCase();

    const label = document.createElement('span');
    label.textContent = link.name;

    a.append(tile, label);
    wrap.appendChild(a);
  }
</script>
</body>
</html>
